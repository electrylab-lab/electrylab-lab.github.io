<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Treatment Salon Lien 様 ヒアリングシート | ELECTRY LAB</title>
<style>
:root{--bg:#ffffff;--card:#ffffff;--soft:#f7f8fa;--line:#e3e6eb;--text:#1f2430;--sub:#7a8391;--teal:#2BBFBF;--mag:#E8237A;--warn:#C9822F;--warnb:#FFF6EA}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.7}
.bar{height:3px;background:linear-gradient(90deg,var(--teal),var(--mag))}
.wrap{max-width:560px;margin:0 auto;padding:28px 16px 48px}
header{text-align:center;margin-bottom:20px}
header img{width:64px}
.brand{font-size:12px;letter-spacing:.3em;color:var(--sub)}
h1{font-size:20px;margin:6px 0 0}
h1 .nm{display:block;font-size:24px}
.lead{font-size:13px;color:var(--sub);margin:8px 0 0}
.legend{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--sub);margin:12px 0 0}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.legend .l2::before{background:linear-gradient(135deg,var(--teal),var(--mag))}
.legend .l3::before{background:var(--warn)}
.legend .l1::before{background:#fff;border:1px solid #c5cad2}
.upd{font-size:11px;color:var(--sub);text-align:center;margin-top:6px}
.wait{background:var(--warnb);border:1px solid #f1d9b5;border-radius:14px;padding:14px 16px;margin:22px 0 0}
.wait h2{margin:0 0 4px;font-size:14px;color:var(--warn)}
.wait ul{margin:0;padding-left:1.2em;font-size:13px}
h2.s{font-size:15px;margin:28px 0 10px}
h2.s small{font-weight:normal;color:var(--sub);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:6px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px 6px 12px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);font:inherit;font-size:12px;line-height:1.4;text-align:center;cursor:pointer;box-shadow:0 1px 3px rgba(20,30,50,.05)}
.tile.big{padding:22px 8px 16px;font-size:15px;font-weight:bold}
.tile .ic{width:34px;height:34px}
.tile.big .ic{width:52px;height:52px}
.tile.done{border:2px solid transparent;background:linear-gradient(160deg,#eefafa,#fdeef5) padding-box,linear-gradient(135deg,var(--teal),var(--mag)) border-box}
.tile.ask{border:2px solid var(--warn);background:var(--warnb)}
.tile.later{border-style:dashed;color:var(--sub)}
.tile.later .ic{opacity:.45}
.badge{position:absolute;top:-10px;right:-8px;min-width:28px;height:28px;padding:0 7px;display:none;place-items:center;font-size:12px;font-weight:bold;border-radius:999px;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.tile.done .badge{display:grid;background:linear-gradient(135deg,var(--teal),var(--mag));font-size:15px}
.tile.ask .badge{display:grid;background:var(--warn)}
.tile.later .badge{display:grid;background:#fff;color:var(--sub);border:1px dashed #c5cad2;box-shadow:none;font-weight:normal}
.note{font-size:12px;color:var(--sub);margin-top:10px}
dialog{border:none;border-radius:18px;background:#fff;color:var(--text);padding:0;width:min(94vw,440px);max-height:86vh;overflow:auto;overscroll-behavior:contain;box-shadow:0 10px 40px rgba(20,30,50,.25)}
dialog::backdrop{background:rgba(20,25,35,.45)}
.dh{position:sticky;top:0;background:#fff;padding:18px 20px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.dh .ic{width:30px;height:30px;flex:none}
.dh h3{margin:0;font-size:16px;flex:1}
.dh button{background:none;border:none;font-size:22px;color:var(--sub);cursor:pointer;line-height:1}
.db{padding:6px 20px 20px}
.grp{font-size:12px;font-weight:bold;color:var(--teal);margin:14px 0 2px}
.row{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.k{width:7.2em;flex:none;color:var(--sub);font-size:12.5px}
.v{flex:1;min-width:0;overflow-wrap:anywhere}
.chip{display:inline-block;font-size:11px;padding:0 9px;border-radius:999px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.chip.ask{background:var(--warn);color:#fff}
.chip.todo{border:1px solid #c5cad2;color:var(--sub)}
.memo{display:block;font-size:11.5px;color:var(--sub)}
.acts{display:grid;gap:8px;margin-top:16px}
.acts a{display:block;text-align:center;text-decoration:none;padding:12px;border-radius:10px;border:1px solid var(--line);color:var(--text);font-size:14px}
.acts a.pri{border:none;background:linear-gradient(90deg,var(--teal),var(--mag));color:#fff;font-weight:bold}
footer{text-align:center;color:var(--sub);font-size:12px;margin-top:40px}
footer a{color:var(--sub)}
</style>
</head>
<body>
<div class="bar"></div>
<div class="wrap">
  <header>
    <img src="../../img/mark.png" alt="">
    <div class="brand">ELECTRY LAB</div>
    <h1><span class="nm">Treatment Salon Lien 様</span>ヒアリングシート</h1>
    <p class="lead">アイコンを押すと、いただいた内容が見られます。<br>変更や追加もそこからどうぞ。</p>
    <div class="legend"><span class="l2">いただいた内容 ✓</span><span class="l3">お返事待ちあり</span><span class="l1">これから</span></div>
    <div class="upd" id="upd"></div>
  </header>

  <div class="wait" id="wait"></div>

  <h2 class="s">1. 基本ヒアリング</h2>
  <div class="grid2" id="big"></div>

  <h2 class="s">2. 頼みたいもの</h2>
  <div class="grid" id="grid"></div>
  <p class="note">点線のアイコンは、名刺・カードのあとに進める予定のものです。</p>

  <footer>© ELECTRY LAB ・ 旭川<br><a href="mailto:info@electry.jp">info@electry.jp</a></footer>
</div>

<dialog id="dlg"><div class="dh"><span id="dI"></span><h3 id="dT"></h3><button type="button" aria-label="閉じる" onclick="dlg.close()">×</button></div><div class="db" id="dB"></div></dialog>

<script src="../../img/icons.js"></script>
<script>
// Lien 様専用。内容を更新したら UPDATED と ITEMS を書き換える。
// 状態: done=済 / ask=お返事待ちあり / todo=これから（押すとフォームへ） / later=あとで
// 個人の携帯番号は公開ページのため下4桁だけ表示する。
const UPDATED='2026年11月8日';
const NAME='Treatment Salon Lien';
const ITEMS=[
 {k:'shop',t:'店舗・会社の方',ic:'shop',big:true,u:'https://tally.so/r/X5xyyO',s:'ask',rows:[
   ['店名','Treatment Salon Lien'],
   ['場所','〒078-8350 北海道旭川市東光10条4丁目1-14　こころ整骨院内'],
   ['サロン電話','070-2192-7394'],
   ['コンセプト','お客様の心が休まり、幸せな時間を過ごせるサロン。子育て・家事・仕事でストレスを感じる方に、心と身体の両方の「癒やし」を'],
   ['好きな色','アイボリー／グレージュ／モカブラウン／ゴールド'],
   ['Instagram など','','ask','お持ちでしたら教えてください'],
 ]},
 {k:'person',t:'個人の方',ic:'person',big:true,s:'none'},
 {k:'meishi',t:'名刺',ic:'meishi',u:'https://tally.so/r/7XR55L',s:'ask',groups:[
   ['高橋 沙織さま',[
     ['肩書','代表エステティシャン'],
     ['お名前のよみ','たかはし　さおり','ask','漢字（高／髙）とよみをご確認ください'],
     ['携帯番号','080-****-1572','ask','個人の番号を名刺に載せてよいか'],
   ]],
   ['松田 三貴也さま',[
     ['肩書','オーナー（こころ整骨院）'],
     ['お名前のよみ','まつだ　みきや','ask'],
     ['携帯番号','080-****-3555'],
   ]],
   ['裏面（紹介カード）',[
     ['内容','サロンのロゴ・LINEのQR・ご紹介者のお名前欄'],
     ['QRのつなぎ先','LINE公式アカウントのURL','ask','個人のLINEではなく、お店用の公式アカウントがおすすめです'],
     ['ご紹介特典','紹介した方・された方の両方に特典','ask','特典の中身（○円OFF など）を教えてください'],
   ]],
   ['そのほか',[
     ['枚数','','ask','おひとり100枚でよいか'],
   ]],
 ]},
 {k:'logo',t:'ロゴ',ic:'logo',u:'https://tally.so/r/aOQoo9',s:'done',rows:[
   ['デザイン','筆記体の「Lien」＋葉の先に雫','','葉から癒やしのエッセンスがこぼれるイメージ'],
   ['文字','Treatment Salon'],
   ['色','アイボリー・ゴールド・セージ'],
   ['仕上げ','印刷用に線を整えた最終データを制作中'],
 ]},
 {k:'shopcard',t:'予約・ポイントカード',ic:'shopcard',u:'https://tally.so/r/bZ5GGe',s:'todo',rows:[
   ['スタンプ','12個（6個×2段）・日付を書くマス'],
   ['特典','6個目＝500円OFF／12個目＝メニュー1つサービス'],
   ['カードの形','1枚（ペラ）か、二つ折りか','todo'],
   ['載せる情報','営業時間・定休日・ご予約方法・駐車場など','todo'],
   ['スタンプの決まり','有効期限・「サービス」になるメニューの範囲','todo'],
   ['枚数','','todo'],
 ]},
 {k:'menu',t:'料金表・メニュー',ic:'menu',s:'later',rows:[
   ['予定','パンフレット・iPadメニュー。メニュー・写真がそろってから、同じロゴと色で作ります'],
 ]},
 {k:'flyer',t:'チラシ・ポスター',ic:'flyer',u:'https://tally.so/r/Ar755B',s:'none'},
];
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const url=(f,type)=>f.u+'?'+new URLSearchParams({name:NAME,type,who:'shop'});
const CH={ask:'<span class="chip ask">確認</span>',todo:'<span class="chip todo">これから</span>'};
const row=([k,v,s,m])=>`<div class="row"><div class="k">${esc(k)}</div><div class="v">${esc(v)}${CH[s]||''}${m?`<span class="memo">${esc(m)}</span>`:''}</div></div>`;
document.getElementById('upd').textContent='最終更新　'+UPDATED;

const waits=[];ITEMS.forEach(f=>{(f.rows||[]).forEach(r=>{if(r[2]==='ask')waits.push(f.t+'：'+r[0])});(f.groups||[]).forEach(([g,rs])=>rs.forEach(r=>{if(r[2]==='ask')waits.push(f.t+'：'+g+' '+r[0])}))});
const w=document.getElementById('wait');
if(waits.length)w.innerHTML=`<h2>お返事をお待ちしている項目（${waits.length}）</h2><ul>${waits.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="memo" style="margin:6px 0 0">オレンジのアイコンを押すと、くわしく見られます。</p>`;else w.remove();

const dlg=document.getElementById('dlg');
function open_(f){
  document.getElementById('dI').replaceChildren(ElectryIcon(f.ic));
  document.getElementById('dT').textContent=f.t;
  let b=f.rows?f.rows.map(row).join(''):'';
  if(f.groups)b=f.groups.map(([g,rs])=>`<div class="grp">${esc(g)}</div>`+rs.map(row).join('')).join('');
  let a='';
  if(f.u){a= f.s==='todo'
    ? `<a class="pri" href="${url(f,'new')}" target="_blank" rel="noopener">残りの質問に答える</a>`
    : `<a class="pri" href="${url(f,'change')}" target="_blank" rel="noopener">修正・変更を伝える</a><a href="${url(f,'more')}" target="_blank" rel="noopener">追加でお願いする</a>`;}
  document.getElementById('dB').innerHTML=b+(a?`<div class="acts">${a}</div>`:'');
  dlg.showModal();dlg.scrollTop=0;
}
const BADGE={done:'✓',ask:'確認',todo:'',later:'あとで'};
ITEMS.forEach(f=>{
  const b=document.createElement('button');b.type='button';
  b.className='tile'+(f.big?' big':'')+(f.s!=='none'&&f.s!=='todo'?' '+f.s:'');
  const lab=document.createElement('span');lab.textContent=f.t;
  const bd=document.createElement('span');bd.className='badge';bd.textContent=BADGE[f.s]||'';
  b.append(ElectryIcon(f.ic),lab,bd);
  b.onclick=()=>{ if(f.rows||f.groups) open_(f); else if(f.u) window.open(url(f,'new'),'_blank','noopener'); };
  (f.big?document.getElementById('big'):document.getElementById('grid')).append(b);
});
</script>
</body>
</html>
