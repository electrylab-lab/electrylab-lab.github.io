<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Treatment Salon Lien 様 ヒアリングシート | ELECTRY LAB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--soft:#FBF8F3;--line:#ECE4D8;--ink:#4A3B30;--sub:#8A7D6E;--gold:#A8834F;--sage:#8E9479;--sageb:#EEF0E8;--warn:#B07A3C;--warnb:#F8EFE2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Shippori Mincho","Hiragino Mincho ProN",serif;line-height:1.8;-webkit-text-size-adjust:100%}
.wrap{max-width:600px;margin:0 auto;padding:36px 16px 56px}
header{text-align:center;margin-bottom:26px}
.en{font-family:"Cormorant Garamond",serif}
.brand{font-size:12px;letter-spacing:.32em;color:var(--sub)}
.salon{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:40px;color:var(--gold);line-height:1.1;margin:14px 0 0}
.salon small{display:block;font-style:normal;font-size:12px;letter-spacing:.34em;color:var(--gold);margin-top:6px}
h1{font-size:17px;font-weight:400;letter-spacing:.2em;margin:16px 0 0}
.lead{font-size:13px;color:var(--sub);margin:10px 0 0}
.legend{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 14px;margin-top:14px;font-size:12px;color:var(--sub)}
.chip{display:inline-block;font-size:11px;letter-spacing:.08em;padding:1px 10px;border-radius:999px;border:1px solid;white-space:nowrap;font-family:"Hiragino Sans","Noto Sans JP",sans-serif}
.c-done{color:var(--sage);border-color:#C9CDB9;background:var(--sageb)}
.c-ask{color:var(--warn);border-color:#E6CFA8;background:var(--warnb)}
.c-todo{color:var(--sub);border-color:var(--line);background:#fff}
.c-later{color:#B3A899;border-color:var(--line);border-style:dashed;background:#fff}
.todo-box{background:var(--warnb);border:1px solid #EAD8BC;border-radius:14px;padding:16px 18px;margin:0 0 22px}
.todo-box h2{font-size:14px;font-weight:600;color:var(--warn);margin:0 0 6px;letter-spacing:.1em}
.todo-box ul{margin:0;padding-left:1.2em;font-size:13px}
.sec{border:1px solid var(--line);border-radius:16px;background:#fff;margin-bottom:14px;overflow:hidden}
.sec>summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;align-items:center;gap:12px}
.sec>summary::-webkit-details-marker{display:none}
.num{font-family:"Cormorant Garamond",serif;font-size:22px;color:var(--gold);width:26px;flex:none}
.ttl{flex:1;font-size:15px;letter-spacing:.06em}
.ttl small{display:block;font-size:11.5px;color:var(--sub);letter-spacing:0}
.arw{color:var(--sub);transition:transform .2s;font-size:12px}
.sec[open] .arw{transform:rotate(90deg)}
.body{padding:0 18px 18px;border-top:1px solid var(--line);background:var(--soft)}
.grp{font-size:12px;color:var(--gold);letter-spacing:.14em;margin:16px 0 6px}
.row{display:flex;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.row:last-child{border-bottom:none}
.k{width:7.5em;flex:none;color:var(--sub);font-size:12.5px}
.v{flex:1;min-width:0;overflow-wrap:anywhere}
.v .chip{margin-left:6px;vertical-align:1px}
.memo{font-size:11.5px;color:var(--sub);display:block}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.acts a{flex:1 1 160px;text-align:center;text-decoration:none;font-size:13.5px;padding:11px 10px;border-radius:999px;border:1px solid var(--gold);color:var(--gold);background:#fff;letter-spacing:.06em}
.acts a.pri{background:var(--gold);color:#fff}
.upd{font-size:11.5px;color:var(--sub);text-align:right;margin:-4px 0 18px}
footer{text-align:center;color:var(--sub);font-size:12px;margin-top:40px;letter-spacing:.08em}
footer a{color:var(--sub)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">ELECTRY LAB</div>
    <div class="salon">Lien<small>TREATMENT SALON</small></div>
    <h1>ヒアリングシート</h1>
    <p class="lead">これまでにいただいた内容をまとめています。<br>変えたいところ・付け足したいところは、各項目のボタンからどうぞ。</p>
    <div class="legend"><span><span class="chip c-done">済</span> いただいた内容</span><span><span class="chip c-ask">確認</span> お返事待ち</span><span><span class="chip c-todo">これから</span> まだの項目</span></div>
  </header>
  <div class="upd" id="upd"></div>
  <div class="todo-box" id="todo"></div>
  <div id="list"></div>
  <footer>© ELECTRY LAB ・ 旭川<br><a href="mailto:info@electry.jp">info@electry.jp</a></footer>
</div>
<script>
// Lien 様専用ページ。内容を更新したら DATA と UPDATED を書き換える。
// 個人の携帯番号は公開ページのため末尾4桁だけ表示する。
const UPDATED='2026年11月8日';
const NAME='Treatment Salon Lien';
const F={basic:'https://tally.so/r/X5xyyO',logo:'https://tally.so/r/aOQoo9',meishi:'https://tally.so/r/7XR55L',shopcard:'https://tally.so/r/bZ5GGe'};
// s: done=済 / ask=確認 / todo=これから / later=あとで
const DATA=[
 {k:'basic',t:'お店の基本',sub:'店名・場所・コンセプト',s:'done',rows:[
   ['店名','Treatment Salon Lien','done'],
   ['場所','〒078-8350 北海道旭川市東光10条4丁目1-14　こころ整骨院内','done'],
   ['サロン電話','070-2192-7394','done'],
   ['コンセプト','お客様の心が休まり、幸せな時間を過ごせるサロン。子育て・家事・仕事でストレスを感じる方に、心と身体の両方の「癒やし」を','done'],
   ['好きな色','アイボリー／グレージュ／モカブラウン／ゴールド','done'],
   ['Instagram など','お持ちでしたら教えてください','ask'],
 ]},
 {k:'logo',t:'ロゴ',sub:'デザイン決定',s:'done',rows:[
   ['デザイン','筆記体の「Lien」＋葉の先に雫','done','葉から癒やしのエッセンスがこぼれるイメージ'],
   ['文字','Treatment Salon','done'],
   ['色','アイボリー・ゴールド・セージ','done'],
   ['仕上げ','印刷用に線を整えた最終データを制作中','done'],
 ]},
 {k:'meishi',t:'名刺',sub:'2名分・裏は紹介カード',s:'ask',groups:[
   ['高橋 沙織さま',[
     ['肩書','代表エステティシャン','done'],
     ['お名前のよみ','たかはし　さおり','ask','漢字（高／髙）とよみをご確認ください'],
     ['携帯番号','080-****-1572','ask','個人の番号を名刺に載せてよいか'],
   ]],
   ['松田 三貴也さま',[
     ['肩書','オーナー（こころ整骨院）','done'],
     ['お名前のよみ','まつだ　みきや','ask'],
     ['携帯番号','080-****-3555','done'],
   ]],
   ['裏面（紹介カード）',[
     ['内容','サロンのロゴ・LINEのQR・ご紹介者のお名前欄','done'],
     ['QRのつなぎ先','LINE公式アカウントのURL','ask','個人のLINEではなく、お店用の公式アカウントがおすすめです'],
     ['ご紹介特典','「紹介した方・された方の両方に特典」','ask','特典の中身（○円OFF など）を教えてください'],
   ]],
   ['そのほか',[
     ['枚数','','ask','おひとり100枚でよいか'],
   ]],
 ]},
 {k:'shopcard',t:'ショップ・スタンプカード',sub:'お店の情報＋スタンプ',s:'todo',rows:[
   ['スタンプ','12個（6個×2段）・日付を書くマス','done'],
   ['特典','6個目＝500円OFF／12個目＝メニュー1つサービス','done'],
   ['カードの形','1枚（ペラ）か、二つ折りか','todo'],
   ['載せる情報','営業時間・定休日・ご予約方法・駐車場など','todo'],
   ['スタンプの決まり','有効期限・「サービス」になるメニューの範囲','todo'],
   ['枚数','','todo'],
 ]},
 {k:'later',t:'パンフレット・iPadメニュー',sub:'メニュー・写真がそろってから',s:'later',rows:[
   ['進め方','名刺・カードのあとに、同じロゴと色で作ります','later'],
 ]},
];
const LBL={done:'済',ask:'確認',todo:'これから',later:'あとで'};
const chip=s=>`<span class="chip c-${s}">${LBL[s]}</span>`;
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const url=(k,type)=>{const p=new URLSearchParams({name:NAME,type,who:'shop'});return F[k]+'?'+p};
const row=([k,v,s,m])=>`<div class="row"><div class="k">${esc(k)}</div><div class="v">${esc(v)}${s!=='done'?chip(s):''}${m?`<span class="memo">${esc(m)}</span>`:''}</div></div>`;
document.getElementById('upd').textContent='最終更新　'+UPDATED;
// お返事待ちの一覧
const asks=[];DATA.forEach(d=>{(d.rows||[]).concat(...(d.groups||[]).map(g=>g[1].map(r=>[g[0]+' '+r[0]].concat(r.slice(1))))).forEach(r=>{if(r[2]==='ask')asks.push(r[0])})});
const tb=document.getElementById('todo');
tb.innerHTML=asks.length?`<h2>お返事をお待ちしている項目（${asks.length}）</h2><ul>${asks.map(a=>`<li>${esc(a)}</li>`).join('')}</ul>`:'';
if(!asks.length)tb.remove();
document.getElementById('list').innerHTML=DATA.map((d,i)=>{
  let body=d.rows?d.rows.map(row).join(''):'';
  if(d.groups)body=d.groups.map(([g,rs])=>`<div class="grp">${esc(g)}</div>`+rs.map(row).join('')).join('');
  let acts='';
  if(F[d.k]){
    acts= d.s==='todo'
      ? `<a class="pri" href="${url(d.k,'new')}" target="_blank" rel="noopener">質問に答える</a>`
      : `<a href="${url(d.k,'change')}" target="_blank" rel="noopener">修正・変更を伝える</a><a href="${url(d.k,'more')}" target="_blank" rel="noopener">追加でお願いする</a>`;
  }
  return `<details class="sec"${d.s!=='later'&&d.s!=='done'?' open':''}><summary><span class="num">0${i+1}</span><span class="ttl">${esc(d.t)}<small>${esc(d.sub)}</small></span>${chip(d.s)}<span class="arw">▶</span></summary><div class="body">${body}${acts?`<div class="acts">${acts}</div>`:''}</div></details>`;
}).join('');
</script>
</body>
</html>
