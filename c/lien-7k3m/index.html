<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Treatment Salon Lien 様 ヒアリングシート | ELECTRY LAB</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Cormorant+Garamond:wght@400&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F1ED;--paper:#FBFAF8;--line:#D9D6D0;--ink:#222224;--sub:#69696C;--mute:#9A9893;--prism:linear-gradient(90deg,#2BBFBF,#4A8BE8,#8B5CF6,#E8237A)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:"Noto Sans JP","Hiragino Sans",sans-serif;line-height:1.8;background:var(--bg);
 background-image:radial-gradient(60% 40% at 105% 8%,rgba(139,92,246,.10),transparent 70%),radial-gradient(50% 35% at -10% 30%,rgba(43,191,191,.09),transparent 70%),radial-gradient(55% 35% at 110% 85%,rgba(232,35,122,.07),transparent 70%);background-attachment:fixed}
.en{font-family:Montserrat,sans-serif;letter-spacing:.24em;text-transform:uppercase}
.wrap{max-width:560px;margin:0 auto;padding:34px 18px 48px}
header{margin-bottom:8px}
.top{display:flex;align-items:center;gap:14px}
.top img{height:15px}
.top i{flex:1;height:1px;background:var(--ink);opacity:.5}
.kick{font-size:10px;color:var(--sub);margin:14px 0 0;line-height:1.9}
h1{font-family:Montserrat,sans-serif;font-weight:400;font-size:30px;letter-spacing:.06em;line-height:1.15;margin:26px 0 0}
.jp{font-size:13px;letter-spacing:.3em;margin:10px 0 0;padding-bottom:10px;border-bottom:1px solid var(--ink);display:inline-block;min-width:60%}
.pl{display:block;width:72px;height:2px;background:var(--prism);margin:12px 0 0;opacity:.8}
.lead{font-size:13px;color:var(--sub);margin:16px 0 0;letter-spacing:.06em}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:11px;color:var(--sub);margin:16px 0 0}
.legend span::before{content:"";display:inline-block;width:14px;height:2px;margin-right:7px;vertical-align:middle;background:var(--line)}
.legend .l2::before{background:var(--prism)}
.legend .l3::before{background:var(--ink)}
.upd{font-size:10px;color:var(--mute);margin-top:6px}
.wait{background:var(--paper);border:1px solid var(--line);border-left:2px solid var(--ink);padding:14px 16px;margin:26px 0 0}
.wait h2{margin:0 0 6px;font-size:13px;font-weight:500;letter-spacing:.1em}
.wait h2 .en{font-size:10px;color:var(--sub);margin-right:10px}
.wait ul{margin:0;padding-left:1.1em;font-size:12.5px;color:var(--ink)}
h2.s{display:flex;align-items:baseline;gap:12px;font-size:13px;font-weight:500;letter-spacing:.14em;margin:34px 0 12px}
h2.s .no{font-family:"Cormorant Garamond",serif;font-size:30px;font-weight:400;line-height:1;letter-spacing:0}
h2.s .en{font-size:9.5px;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-top:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:8px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:18px 6px 14px;border:1px solid var(--line);border-radius:2px;background:var(--paper);color:var(--ink);font:inherit;font-size:11.5px;letter-spacing:.06em;line-height:1.4;text-align:center;cursor:pointer;transition:border-color .2s}
.tile:hover{border-color:var(--ink)}
.tile.big{padding:24px 8px 18px;font-size:13.5px}
.tile .ic{width:30px;height:30px}
.tile.big .ic{width:42px;height:42px}
.tile:not(.done) .ic *{stroke:var(--ink)!important}
.tile.done::after{content:"";position:absolute;left:-1px;right:-1px;bottom:-1px;height:2px;background:var(--prism)}
.tile.ask{border-color:var(--ink)}
.tile.later{border-style:dashed;color:var(--mute)}
.tile.later .ic{opacity:.35}
.badge{position:absolute;top:7px;right:8px;display:none;font-family:Montserrat,sans-serif;font-size:8px;letter-spacing:.2em;font-weight:600;color:var(--sub)}
.tile.done .badge,.tile.ask .badge,.tile.later .badge{display:block}
.tile.ask .badge{color:#fff;background:var(--ink);padding:1px 5px 1px 7px;top:6px;right:6px}
.note{font-size:11px;color:var(--mute);margin-top:12px}
dialog{border:1px solid var(--line);border-radius:2px;background:var(--paper);color:var(--ink);padding:0;width:min(94vw,440px);max-height:86vh;overflow:auto;overscroll-behavior:contain;box-shadow:0 18px 50px rgba(30,30,32,.18)}
dialog::backdrop{background:rgba(243,241,237,.75);backdrop-filter:blur(3px)}
.dh{position:sticky;top:0;background:var(--paper);padding:18px 20px 12px;border-bottom:1px solid var(--ink);display:flex;align-items:center;gap:12px;z-index:1}
.dh .ic{width:26px;height:26px;flex:none}
.dh .ic *{stroke:var(--ink)!important}
.dh h3{margin:0;font-size:15px;font-weight:500;letter-spacing:.12em;flex:1}
.dh button{background:none;border:none;font-size:22px;color:var(--sub);cursor:pointer;line-height:1}
.db{padding:4px 20px 20px}
.grp{font-family:Montserrat,"Noto Sans JP",sans-serif;font-size:11px;letter-spacing:.16em;color:var(--sub);margin:18px 0 2px;padding-bottom:4px}
.grp::after{content:"";display:block;width:36px;height:2px;background:var(--prism);margin-top:5px;opacity:.75}
.row{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #E6E3DE;font-size:13px}
.k{width:7.2em;flex:none;color:var(--sub);font-size:11.5px;letter-spacing:.06em}
.v{flex:1;min-width:0;overflow-wrap:anywhere}
.chip{display:inline-block;font-family:Montserrat,sans-serif;font-size:8.5px;font-weight:600;letter-spacing:.18em;padding:1px 6px 1px 8px;margin-left:8px;vertical-align:2px;white-space:nowrap}
.chip.ask{background:var(--ink);color:#fff}
.chip.todo{border:1px solid var(--line);color:var(--sub)}
.memo{display:block;font-size:11px;color:var(--sub)}
.acts{display:grid;gap:8px;margin-top:18px}
.acts a{display:block;text-align:center;text-decoration:none;padding:13px;border:1px solid var(--ink);color:var(--ink);font-size:13px;letter-spacing:.12em;background:transparent}
.acts a.pri{background:var(--ink);color:#fff;position:relative}
.acts a.pri::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--prism)}
footer{margin-top:46px;padding-top:16px;border-top:1px solid var(--ink);display:flex;justify-content:space-between;align-items:flex-end;gap:12px;font-size:9.5px;color:var(--sub)}
footer img{height:12px;display:block;margin-bottom:6px}
footer a{color:var(--sub);text-decoration:none;letter-spacing:.1em}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top"><img src="../../img/wordmark_light.png" alt="ELECTRY LAB"><i></i></div>
    <div class="kick en">Hearing sheet<br>Logo / Business card / Shop card</div>
    <h1>Treatment Salon<br>Lien</h1>
    <div class="jp">ヒアリングシート</div>
    <span class="pl"></span>
    <p class="lead">アイコンを押すと、いただいた内容が見られます。<br>変更や追加も、そこからどうぞ。</p>
    <div class="legend"><span class="l2">いただいた内容</span><span class="l3">お返事待ちあり</span><span>これから</span></div>
    <div class="upd" id="upd"></div>
  </header>

  <div class="wait" id="wait"></div>

  <h2 class="s"><span class="no">01</span>基本ヒアリング<span class="en">Basic</span></h2>
  <div class="grid2" id="big"></div>

  <h2 class="s"><span class="no">02</span>頼みたいもの<span class="en">Order</span></h2>
  <div class="grid" id="grid"></div>
  <p class="note">点線は、名刺・カードのあとに進める予定のものです。</p>

  <footer><div><img src="../../img/wordmark_light.png" alt="ELECTRY LAB"><span class="en" style="letter-spacing:.3em">Design &amp; Creative</span></div><div style="text-align:right"><span class="en" style="letter-spacing:.2em">Asahikawa</span><br><a href="mailto:info@electry.jp">info@electry.jp</a></div></footer>
</div>

<dialog id="dlg"><div class="dh"><span id="dI"></span><h3 id="dT"></h3><button type="button" aria-label="閉じる" onclick="dlg.close()">×</button></div><div class="db" id="dB"></div></dialog>

<script src="../../img/icons.js"></script>
<script>
// Lien 様専用。内容を更新したら UPDATED と ITEMS を書き換える。
// 状態: done=済 / ask=お返事待ちあり / todo=これから（押すとフォームへ） / later=あとで
// 個人の携帯番号は公開ページのため下4桁だけ表示する。
const UPDATED='2026年11月13日';
const NAME='Treatment Salon Lien';
const ITEMS=[
 {k:'shop',t:'店舗・会社の方',ic:'shop',big:true,u:'https://tally.so/r/X5xyyO',s:'ask',rows:[
   ['店名','Treatment Salon Lien'],
   ['場所','〒078-8350 北海道旭川市東光10条4丁目1-14　こころ整骨院内'],
   ['サロン電話','070-2192-7394'],
   ['コンセプト','お客様の心が休まり、幸せな時間を過ごせるサロン。子育て・家事・仕事でストレスを感じる方に、心と身体の両方の「癒やし」を'],
   ['好きな色','アイボリー／グレージュ／モカブラウン／ゴールド'],
   ['Instagram など','','ask','お持ちでしたら教えてください'],
 ]},
 {k:'person',t:'個人の方',ic:'person',big:true,s:'none'},
 {k:'meishi',t:'名刺',ic:'meishi',u:'https://tally.so/r/7XR55L',s:'ask',groups:[
   ['デザイン',[
     ['決定','表＝横A／裏＝C（写真）'],
   ]],
   ['高橋 沙織さま',[
     ['肩書','代表エステティシャン'],
     ['お名前のよみ','たかはし　さおり','ask','漢字（高／髙）とよみをご確認ください'],
     ['携帯番号','080-****-1572','','名刺に載せる'],
     ['枚数','100枚'],
   ]],
   ['松田 三貴也さま',[
     ['肩書','オーナー（こころ整骨院）'],
     ['お名前のよみ','まつだ　みきや','ask'],
     ['携帯番号','080-****-3555'],
     ['枚数','200枚'],
   ]],
   ['裏面（紹介カード）',[
     ['内容','サロンのロゴ・LINEのQR・ご紹介者のお名前欄'],
     ['QRのつなぎ先','お二人それぞれのLINE（いただいたQR）','ask','Lienの公式LINEがあれば、そちらもおすすめです'],
     ['ご紹介特典','「ご紹介でおふたりに特典をご用意しています」','','内容は変わっていくため、カードには書かない'],
   ]],
 ]},
 {k:'logo',t:'ロゴ',ic:'logo',u:'https://tally.so/r/aOQoo9',s:'done',rows:[
   ['デザイン','筆記体の「Lien」＋葉の先に雫','','葉から癒やしのエッセンスがこぼれるイメージ'],
   ['文字','Treatment Salon'],
   ['色','アイボリー・ゴールド・セージ'],
   ['仕上げ','印刷用に線を整えた最終データを制作中'],
 ]},
 {k:'shopcard',t:'予約・ポイントカード',ic:'shopcard',u:'https://tally.so/r/bZ5GGe',s:'todo',rows:[
   ['スタンプ','12個（6個×2段）・日付を書くマス'],
   ['特典','6個目＝500円OFF／12個目＝メニュー1つサービス'],
   ['カードの形','1枚（ペラ）か、二つ折りか','todo'],
   ['載せる情報','営業時間・定休日・ご予約方法・駐車場など','todo'],
   ['スタンプの決まり','有効期限・「サービス」になるメニューの範囲','todo'],
   ['枚数','','todo'],
 ]},
 {k:'menu',t:'メニュー表',ic:'menu',s:'later',rows:[
   ['予定','パンフレット・iPadメニュー。メニュー・写真がそろってから、同じロゴと色で作ります'],
 ]},
 {k:'flyer',t:'チラシ・ポスター',ic:'flyer',u:'https://tally.so/r/Ar755B',s:'none'},
];
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const url=(f,type)=>f.u+'?'+new URLSearchParams({name:NAME,type,who:'shop'});
const CH={ask:'<span class="chip ask">CHECK</span>',todo:'<span class="chip todo">TODO</span>'};
const row=([k,v,s,m])=>`<div class="row"><div class="k">${esc(k)}</div><div class="v">${esc(v)}${CH[s]||''}${m?`<span class="memo">${esc(m)}</span>`:''}</div></div>`;
document.getElementById('upd').textContent='最終更新　'+UPDATED;

const waits=[];ITEMS.forEach(f=>{(f.rows||[]).forEach(r=>{if(r[2]==='ask')waits.push(f.t+'：'+r[0])});(f.groups||[]).forEach(([g,rs])=>rs.forEach(r=>{if(r[2]==='ask')waits.push(f.t+'：'+g+' '+r[0])}))});
const w=document.getElementById('wait');
if(waits.length)w.innerHTML=`<h2><span class="en">Waiting</span>お返事をお待ちしている項目（${waits.length}）</h2><ul>${waits.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="memo" style="margin:6px 0 0">黒い枠のアイコンを押すと、くわしく見られます。</p>`;else w.remove();

const dlg=document.getElementById('dlg');
function open_(f){
  document.getElementById('dI').replaceChildren(ElectryIcon(f.ic));
  document.getElementById('dT').textContent=f.t;
  let b=f.rows?f.rows.map(row).join(''):'';
  if(f.groups)b=f.groups.map(([g,rs])=>`<div class="grp">${esc(g)}</div>`+rs.map(row).join('')).join('');
  let a='';
  if(f.u){a= f.s==='todo'
    ? `<a class="pri" href="${url(f,'new')}" target="_blank" rel="noopener">残りの質問に答える</a>`
    : `<a class="pri" href="${url(f,'change')}" target="_blank" rel="noopener">修正・変更を伝える</a><a href="${url(f,'more')}" target="_blank" rel="noopener">追加でお願いする</a>`;}
  document.getElementById('dB').innerHTML=b+(a?`<div class="acts">${a}</div>`:'');
  dlg.showModal();dlg.scrollTop=0;
}
const BADGE={done:'DONE',ask:'CHECK',todo:'',later:'LATER'};
ITEMS.forEach(f=>{
  const b=document.createElement('button');b.type='button';
  b.className='tile'+(f.big?' big':'')+(f.s!=='none'&&f.s!=='todo'?' '+f.s:'');
  const lab=document.createElement('span');lab.textContent=f.t;
  const bd=document.createElement('span');bd.className='badge';bd.textContent=BADGE[f.s]||'';
  b.append(ElectryIcon(f.ic),lab,bd);
  b.onclick=()=>{ if(f.rows||f.groups) open_(f); else if(f.u) window.open(url(f,'new'),'_blank','noopener'); };
  (f.big?document.getElementById('big'):document.getElementById('grid')).append(b);
});
</script>
</body>
</html>
