<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>ヒアリングシート | ELECTRY LAB</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="ELECTRY LAB">
<meta property="og:title" content="ヒアリングシート | ELECTRY LAB">
<meta property="og:description" content="ご依頼内容の確認シートです。上から順にお答えください。">
<meta property="og:image" content="https://electrylab-lab.github.io/img/ogp_top.png">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{--bg:#0e1016;--card:#171a22;--line:#2a2f3a;--text:#fff;--sub:#a9b3bf;--teal:#2BBFBF;--mag:#E8237A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.7}
.bar{height:3px;background:linear-gradient(90deg,var(--teal),var(--mag))}
.wrap{max-width:560px;margin:0 auto;padding:28px 16px 48px}
header{text-align:center;margin-bottom:20px}
header img{width:64px}
.brand{font-size:12px;letter-spacing:.3em;color:var(--sub)}
h1{font-size:22px;margin:6px 0 0}
.lead{font-size:13px;color:var(--sub);margin:6px 0 0}
h2{font-size:15px;margin:28px 0 10px}
.steps{display:grid;gap:10px;counter-reset:s}
a.step{display:flex;align-items:center;gap:12px;padding:16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:#fff;text-decoration:none}
a.step::before{counter-increment:s;content:counter(s);display:grid;place-items:center;flex:none;width:28px;height:28px;border-radius:50%;font-weight:bold;background:linear-gradient(135deg,var(--teal),var(--mag))}
a.step b{display:block}
a.step small{color:var(--sub);font-size:12px}
a.step .go{margin-left:auto;color:var(--teal);font-size:12px;white-space:nowrap}
.menu{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.menu li{font-size:13px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--sub)}
.note{font-size:12px;color:var(--sub);margin-top:10px}
footer{text-align:center;color:var(--sub);font-size:12px;margin-top:40px}
footer a{color:var(--sub)}
</style>
</head>
<body>
<div class="bar"></div>
<div class="wrap">
  <header>
    <img src="../img/mark.png" alt="">
    <div class="brand">ELECTRY LAB</div>
    <h1 id="title">ヒアリングシート</h1>
    <p class="lead">上から順にお答えください。途中で分からないところは空欄で大丈夫です。</p>
  </header>

  <div class="steps" id="steps"></div>

  <h2>ほかにもこんなものを作っています</h2>
  <ul class="menu">
    <li>名刺</li><li>ショップカード</li><li>チラシ・ポスター</li><li>メニュー表</li>
    <li>POP</li><li>ロゴ</li><li>SNS用画像</li><li>似顔絵</li>
    <li>ライター・グッズ</li><li>QRコード</li><li>お店の業務システム</li>
  </ul>
  <p class="note">気になるものがあれば、基本ヒアリングの「作りたい物」で選ぶか、お気軽にお声がけください。</p>

  <footer>© ELECTRY LAB ・ 旭川<br><a href="mailto:info@electry.jp">info@electry.jp</a></footer>
</div>
<script>
// 使い方: /sheet/?n=お客様名&f=lighter
//   n = 宛名（「◯◯様」と表示。フォームにも name として渡す）
//   f = 基本の下に出すフォーム（カンマ区切り）
const FORMS = {
  basic:   {title:'基本ヒアリング', sub:'お名前・お店のこと・作りたい物', href:'../form/'},
  lighter: {title:'オリジナルライター', sub:'本数・デザインの内容', href:'../lighter/'},
};
const q = new URLSearchParams(location.search);
const name = (q.get('n')||'').trim().slice(0,40);
const list = ['basic', ...(q.get('f')||'').split(',').map(s=>s.trim()).filter(k=>FORMS[k] && k!=='basic')];
if(name){
  const h=document.getElementById('title');h.textContent='';const nm=document.createElement('span');nm.style.cssText='display:block;font-size:26px';nm.textContent=name+' 様';h.append(nm,'ヒアリングシート');
  document.title = name + ' 様 ヒアリングシート | ELECTRY LAB';
}
const pass = name ? '?name=' + encodeURIComponent(name) : '';
const box = document.getElementById('steps');
[...new Set(list)].forEach(k=>{
  const f = FORMS[k], a = document.createElement('a');
  a.className = 'step'; a.href = f.href + pass;
  const t = document.createElement('div');
  const b = document.createElement('b'); b.textContent = f.title;
  const s = document.createElement('small'); s.textContent = f.sub;
  t.append(b, s);
  const go = document.createElement('span'); go.className = 'go'; go.textContent = '回答する →';
  a.append(t, go); box.append(a);
});
</script>
</body>
</html>
