<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>ヒアリングシート | ELECTRY LAB</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="ELECTRY LAB">
<meta property="og:title" content="ヒアリングシート | ELECTRY LAB">
<meta property="og:description" content="ご依頼内容の確認シートです。アイコンを押してお答えください。">
<meta property="og:image" content="https://electrylab-lab.github.io/img/ogp_top.png">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{--bg:#0e1016;--card:#171a22;--line:#2a2f3a;--text:#fff;--sub:#a9b3bf;--teal:#2BBFBF;--mag:#E8237A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.7}
.bar{height:3px;background:linear-gradient(90deg,var(--teal),var(--mag))}
.wrap{max-width:560px;margin:0 auto;padding:28px 16px 48px}
header{text-align:center;margin-bottom:20px}
header img{width:64px}
.brand{font-size:12px;letter-spacing:.3em;color:var(--sub)}
h1{font-size:20px;margin:6px 0 0}
h1 .nm{display:block;font-size:26px}
.lead{font-size:13px;color:var(--sub);margin:8px 0 0}
.legend{display:flex;justify-content:center;gap:16px;font-size:12px;color:var(--sub);margin:12px 0 0}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.legend .l1::before{background:#3a404c;border:1px solid #555}
.legend .l2::before{background:linear-gradient(135deg,var(--teal),var(--mag))}
h2{font-size:15px;margin:28px 0 10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px 6px 12px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:#fff;font:inherit;font-size:12px;line-height:1.4;text-align:center;cursor:pointer;transition:all .3s}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile.big{padding:22px 8px 16px;font-size:15px;font-weight:bold}
.tile.big .ic{width:52px;height:52px}
h2 small{font-weight:normal;color:var(--sub);font-size:12px}
.tile .ic{width:34px;height:34px;transition:all .3s}
.tile.opened{border-style:dashed;border-color:#4a5260}
.tile.done{border:2px solid transparent;background:linear-gradient(160deg,#173a37,#3a1830) padding-box,linear-gradient(135deg,var(--teal),var(--mag)) border-box;box-shadow:0 0 18px rgba(43,191,191,.25)}
.tile.done .ic{filter:drop-shadow(0 0 6px rgba(43,191,191,.7))}
.badge{position:absolute;top:6px;right:6px;font-size:10px;padding:1px 7px;border-radius:999px;font-weight:bold}
.tile.done .badge{top:-10px;right:-8px;width:28px;height:28px;padding:0;display:grid;place-items:center;font-size:15px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--mag))!important;color:#fff!important;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.grid,.grid2{padding-top:6px}
.tile.opened .badge{background:#2a2f3a;color:var(--sub)}

.plain{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.plain li{font-size:12px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;color:var(--sub)}
.note{font-size:12px;color:var(--sub);margin-top:10px}
dialog{border:1px solid var(--line);border-radius:16px;background:#151821;color:#fff;padding:20px;width:min(92vw,360px)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h3{margin:0 0 4px;font-size:16px}
dialog p{margin:0 0 14px;font-size:12px;color:var(--sub)}
dialog .acts{display:grid;gap:8px}
dialog button{padding:12px;border-radius:10px;border:1px solid var(--line);background:#0f1218;color:#fff;font:inherit;font-size:14px;cursor:pointer}
dialog button.pri{border:none;background:linear-gradient(90deg,var(--teal),var(--mag));font-weight:bold}
dialog button.ok{border-color:var(--teal);color:var(--teal)}
dialog button.x{background:none;border:none;color:var(--sub);font-size:13px}
footer{text-align:center;color:var(--sub);font-size:12px;margin-top:40px}
footer a{color:var(--sub)}
</style>
</head>
<body>
<div class="bar"></div>
<div class="wrap">
  <header>
    <img src="../img/mark.png" alt="">
    <div class="brand">ELECTRY LAB</div>
    <h1 id="title">ヒアリングシート</h1>
    <p class="lead">アイコンを押してお答えください。何度でも送れます。</p>
    <div class="legend"><span class="l2">送信できたら ✓ が付きます</span></div>
  </header>

  <h2>1. 基本ヒアリング <small>（どちらか1つ）</small></h2>
  <div class="grid2" id="big"></div>

  <h2>2. 頼みたいもの <small>（あてはまるものすべて）</small></h2>
  <div class="grid" id="grid"></div>

  <h2>ほかにも作れます</h2>
  <ul class="plain"><li>POP</li><li>SNS用画像</li><li>似顔絵</li><li>グッズ</li><li>QRコード</li><li>業務システム</li></ul>
  <p class="note">これらは「基本ヒアリング」の「作りたい物」で選んでください。</p>

  <footer>© ELECTRY LAB ・ 旭川<br><a href="mailto:info@electry.jp">info@electry.jp</a></footer>
</div>

<dialog id="dlg">
  <h3 id="dT"></h3>
  <p id="dP"></p>
  <div class="acts" id="dA"></div>
</dialog>

<script src="../img/icons.js"></script>
<script>
// 使い方: /sheet/?n=お客様名
//   基本ヒアリングは個人/店舗の2入口（同じフォームに who=personal/shop を渡す）
//   n = 宛名（「◯◯様」と表示。フォームには name として渡す）
//   フォームには type も渡す: new=はじめて / more=2つ目のご依頼 / change=前回の内容の変更
// 記入済みの表示は、この端末のブラウザにだけ記録される（お店側には届かない）
const FORMS = [
  {k:'person',   t:'個人の方',             ic:'person',   u:'https://tally.so/r/X5xyyO', big:true, who:'personal'},
  {k:'shop',     t:'店舗・会社の方',       ic:'shop',     u:'https://tally.so/r/X5xyyO', big:true, who:'shop'},
  {k:'meishi',   t:'名刺',                 ic:'meishi',   u:'https://tally.so/r/7XR55L'},
  {k:'logo',     t:'ロゴ',                 ic:'logo',     u:'https://tally.so/r/aOQoo9'},
  {k:'shopcard', t:'ショップ・スタンプカード', ic:'shopcard', u:'https://tally.so/r/bZ5GGe'},
  {k:'flyer',    t:'チラシ・ポスター',     ic:'flyer',    u:'https://tally.so/r/Ar755B'},
  {k:'menu',     t:'メニュー表',           ic:'menu',     u:'https://tally.so/r/BEz557'},
  {k:'lighter',  t:'ライター',             ic:'lighter',  u:'https://tally.so/r/2jBJ1L'},
];
const q=new URLSearchParams(location.search);
const name=(q.get('n')||'').trim().slice(0,40);
if(name){
  const h=document.getElementById('title');h.textContent='';
  const nm=document.createElement('span');nm.className='nm';nm.textContent=name+' 様';
  h.append(nm,'ヒアリングシート');document.title=name+' 様 ヒアリングシート | ELECTRY LAB';
}
const KEY='electry-sheet:'+name;
let st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const url=(f,type)=>{const p=new URLSearchParams();if(name)p.set('name',name);p.set('type',type);if(f.who)p.set('who',f.who);return f.u+'?'+p};
const go=(f,type)=>{window.open(url(f,type),'_blank','noopener'); if(st[f.k]!=='done'){st[f.k]='opened';save();}render();};

const dlg=document.getElementById('dlg'),dT=document.getElementById('dT'),dP=document.getElementById('dP'),dA=document.getElementById('dA');
function btn(txt,cls,fn){const b=document.createElement('button');b.textContent=txt;if(cls)b.className=cls;b.onclick=()=>{dlg.close();fn&&fn();};return b;}
function ask(f){
  dT.textContent=f.t; dA.textContent='';
  if(st[f.k]==='done'){
    dP.textContent='記入済みです。追加や変更があればこちらから。';
    dA.append(btn('もう1件頼む','pri',()=>go(f,'more')),btn('前回の内容を変更する','',()=>go(f,'change')));
  }else{
    dP.textContent='フォームの最後まで送信できたら「送信できた」を押してください。';
    dA.append(btn('送信できた ✓','ok',()=>{st[f.k]='done';save();render();}),btn('もう一度フォームを開く','',()=>go(f,'new')));
  }
  dA.append(btn('閉じる','x'));
  dlg.showModal();
}
const grid=document.getElementById('grid'),bigGrid=document.getElementById('big');
const tiles=FORMS.map(f=>{
  const b=document.createElement('button');b.type='button';b.className='tile'+(f.big?' big':'');
  const lab=document.createElement('span');lab.textContent=f.t;
  const bd=document.createElement('span');bd.className='badge';
  b.append(ElectryIcon(f.ic),lab,bd);
  b.onclick=()=>{ if(!st[f.k]) go(f,'new'); else ask(f); };
  (f.big?bigGrid:grid).append(b); return [f,b,bd];
});
function render(){
  tiles.forEach(([f,b,bd])=>{
    const s=st[f.k];
    b.classList.toggle('opened',s==='opened');b.classList.toggle('done',s==='done');
    bd.textContent= s==='done'?'✓':s==='opened'?'回答中':'';
    bd.style.display=s?'':'none';
  });
}
render();
</script>
</body>
</html>
